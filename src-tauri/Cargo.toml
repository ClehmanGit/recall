[package]
name = "recall"
version = "2.1.1"
edition = "2021"
description = "Local semantic search across AI chats and your files."

[lib]
name = "recall_lib"
# desktop only: the template's "staticlib" and "cdylib" are for iOS and Android,
# and the staticlib alone was 1.8 GB per debug build
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
recall-core = { path = "../core" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
parking_lot = "0.13"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
