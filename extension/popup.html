<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { font-family: Inter, "Segoe UI", system-ui, sans-serif; width: 300px; margin: 0; padding: 16px; background: #f6f3ec; color: #1a1916; font-size: 13px; }
  h1 { font-size: 13px; letter-spacing: .12em; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #e9e4d9; }
  .row span:last-child { font-family: Consolas, ui-monospace, monospace; font-size: 11px; color: #6f6a5f; }
  .ok { color: #4f8a5a } .bad { color: #b3331f }
  label { display: block; margin-top: 14px; font-size: 11px; color: #8a8375; letter-spacing: .08em; }
  input { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 7px 8px; border: 1px solid #d9d3c6; border-radius: 6px; font-family: Consolas, ui-monospace, monospace; font-size: 11px; }
  button { margin-top: 12px; width: 100%; padding: 9px; border: 0; border-radius: 7px; background: #1a1916; color: #f6f3ec; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: #1a1916; border: 1px solid #d9d3c6; margin-top: 6px; }
  .err { color: #b3331f; font-size: 11px; margin-top: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
  <h1><img src="icons/16.png" alt="" width="16" height="16"> RECALL BRIDGE</h1>
  <div class="row"><span>Desktop app</span><span id="app">…</span></div>
  <div class="row"><span>Claude</span><span id="claude">—</span></div>
  <div class="row"><span>Gemini</span><span id="gemini">—</span></div>
  <div class="row"><span>ChatGPT</span><span id="chatgpt">—</span></div>
  <label for="token">APP TOKEN (Recall → Settings)</label>
  <input id="token" placeholder="paste once">
  <button id="save">Save token</button>
  <button id="sync" class="ghost">Sync now</button>
  <div id="err" class="err"></div>
  <script src="popup.js"></script>
</body>
</html>
