# Builds the Windows installer and attaches it to a GitHub Release.
# Trigger: push a tag like v2.1.1. Nobody downloading Recall ever builds anything.
#
#   git tag v2.1.1
#   git push origin v2.1.1
#
# Every action is pinned to a full commit, so a moved or hijacked tag cannot
# change what builds the installer; Dependabot proposes updates
# (.github/dependabot.yml). The embedding model is pinned and hash-checked
# by scripts/fetch-model.mjs.
#
# Optional repository secret:
#   RECALL_FEEDBACK_URL   https endpoint for the feedback button (omit to hide the button)

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # create the release and upload the installer
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            . -> target

      - name: Install dependencies
        run: npm ci

      - name: Fetch embedding model
        run: npm run model

      - name: Build and publish
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECALL_FEEDBACK_URL: ${{ secrets.RECALL_FEEDBACK_URL }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Recall ${{ github.ref_name }}"
          releaseBody: "Download Recall-Setup.exe below and run it."
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      # The website links to releases/latest/download/Recall-Setup.exe, so every
      # release also carries the installer under that fixed name, with its
      # SHA-256 fingerprint so anyone can check their download.
      - name: Attach Recall-Setup.exe and its fingerprint
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $out = "$env:RUNNER_TEMP/Recall-Setup.exe"
          Copy-Item $exe.FullName $out
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          # LF line ending, so sha256sum -c reads it on Linux and macOS too
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/SHA256SUMS.txt", "$hash  Recall-Setup.exe`n")
          gh release upload "$env:TAG" $out "$env:RUNNER_TEMP/SHA256SUMS.txt" --clobber --repo "$env:GITHUB_REPOSITORY"

      # The release notes are this version's section of CHANGELOG.md, under a
      # line on how to install. A tag with no changelog entry keeps the line alone.
      - name: Write the release notes from CHANGELOG.md
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:TAG.TrimStart("v")
          $section = @(); $inside = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## ') { $inside = $line -match ('^## ' + [regex]::Escape($version) + '( |$)'); continue }
            if ($inside) { $section += ($line -replace '^### ', '## ') }
          }
          $intro = "**Download [Recall-Setup.exe](https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/Recall-Setup.exe)** and run it. Windows 10 or 11, 64-bit. If Windows says it protected your PC, click **More info**, then **Run anyway** (the installer is not code-signed yet). ``SHA256SUMS.txt`` holds the installer's fingerprint."
          (@($intro, "") + $section) -join "`n" | Out-File "$env:RUNNER_TEMP/notes.md" -Encoding utf8
          gh release edit "$env:TAG" --notes-file "$env:RUNNER_TEMP/notes.md" --repo "$env:GITHUB_REPOSITORY"
