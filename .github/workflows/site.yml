# Publishes site/ to GitHub Pages: one static page with its own fonts and images,
# nothing loaded from anywhere else. Pages serves it over HTTPS.
# The download button points at the newest release's Recall-Setup.exe
# (see release.yml), so a new version needs no change here. Actions are
# pinned to full commits; Dependabot proposes updates.
name: site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Point the links at this repository
        run: |
          sed -i "s#REPLACE_ME/recall#${GITHUB_REPOSITORY}#g" site/index.html
      - name: Stamp the style and script links so visitors never get a stale copy
        run: |
          sed -i -E "s#\?v=[^\"]*#?v=${GITHUB_SHA::8}#g" site/index.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
